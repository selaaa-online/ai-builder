name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore AIBuilder.slnx

      - name: Build
        run: dotnet build AIBuilder.slnx -c Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test tests/AIBuilder.Core.Tests/AIBuilder.Core.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack AIBuilder.slnx -c Release --no-build -o artifacts -p:Version=$VERSION

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
