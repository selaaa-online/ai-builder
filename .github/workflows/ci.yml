name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore AIBuilder.slnx

      - name: Build
        run: dotnet build AIBuilder.slnx -c Release --no-restore

      - name: Test (unit, all target frameworks)
        run: dotnet test tests/AIBuilder.Core.Tests/AIBuilder.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack AIBuilder.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'push' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Integration tests (skipped when OPENAI_API_KEY is unset)
        run: dotnet test tests/AIBuilder.IntegrationTests/AIBuilder.IntegrationTests.csproj -c Release --verbosity normal
